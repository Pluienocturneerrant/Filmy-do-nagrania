<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmy do nagrania</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Georgia, serif;
            background: #111827;
            color: white;
            padding: 1rem;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1024px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .sync-info {
            background: #1e40af;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }

        .sync-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .sync-btn {
            padding: 0.5rem 1rem;
            background: #2563eb;
            border: none;
            border-radius: 0.5rem;
            color: white;
            cursor: pointer;
            font-family: Georgia, serif;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .sync-btn:hover {
            background: #1d4ed8;
        }

        .sync-btn.danger {
            background: #dc2626;
            font-size: 0.75rem;
            padding: 0.4rem 0.75rem;
        }

        .sync-btn.danger:hover {
            background: #b91c1c;
        }
        
        .stats {
            background: #1f2937;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 0.875rem;
            color: #9ca3af;
            margin-top: 0.25rem;
        }
        
        .blue { color: #60a5fa; }
        .yellow { color: #fbbf24; }
        
        .search-box {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: #1f2937;
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-size: 1rem;
            font-family: Georgia, serif;
        }
        
        .search-box input::placeholder {
            color: #9ca3af;
        }
        
        .search-box input:focus {
            outline: 2px solid #3b82f6;
        }
        
        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }
        
        .film-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .film-item {
            background: #1f2937;
            border-radius: 0.5rem;
            padding: 1rem;
        }
        
        .film-item.empty {
            border: 2px dashed #fbbf24;
        }
        
        .film-content {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .film-row {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .film-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            padding-left: 4.25rem;
        }
        
        .film-number {
            width: 3.5rem;
            height: 3.5rem;
            background: #2563eb;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.125rem;
            flex-shrink: 0;
        }
        
        .film-title-container {
            flex-grow: 1;
            min-width: 0;
        }
        
        .film-title {
            font-size: 1.125rem;
            padding: 0.5rem;
            margin: -0.5rem;
            border-radius: 0.25rem;
            cursor: pointer;
            word-wrap: break-word;
        }
        
        .film-title:hover {
            background: #374151;
        }
        
        .film-title.empty {
            color: #fbbf24;
            font-style: italic;
        }
        
        .film-edit input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: #374151;
            border: none;
            border-radius: 0.25rem;
            color: white;
            font-size: 1rem;
            font-family: Georgia, serif;
            margin-bottom: 0.5rem;
        }
        
        .film-edit input:focus {
            outline: 2px solid #3b82f6;
        }
        
        .film-buttons {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn {
            flex: 1;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.25rem;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            font-family: Georgia, serif;
        }
        
        .btn-save {
            background: #16a34a;
            color: white;
        }
        
        .btn-save:hover {
            background: #15803d;
        }
        
        .btn-cancel {
            background: #4b5563;
            color: white;
        }
        
        .btn-cancel:hover {
            background: #374151;
        }
        
        .btn-delete {
            flex-shrink: 0;
            padding: 0.5rem 0.75rem;
            background: #374151;
            border: none;
            color: #f87171;
            cursor: pointer;
            border-radius: 0.5rem;
            font-size: 1.125rem;
        }
        
        .btn-delete:hover {
            background: #4b5563;
            color: #fca5a5;
        }

        .checkbox-container {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: #374151;
            border-radius: 0.5rem;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-container:hover {
            background: #4b5563;
        }

        .checkbox-container input[type="checkbox"] {
            width: 1.25rem;
            height: 1.25rem;
            cursor: pointer;
            accent-color: #16a34a;
        }

        .checkbox-label {
            font-size: 0.875rem;
            color: #9ca3af;
        }

        .checkbox-container.checked .checkbox-label {
            color: #4ade80;
            font-weight: 600;
        }
        
        .success-message, .error-message {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }

        .success-message {
            background: #16a34a;
            color: white;
        }
        
        .error-message {
            background: #dc2626;
            color: white;
        }
        
        .no-results {
            text-align: center;
            color: #9ca3af;
            padding: 3rem 0;
        }
        
        .loading {
            text-align: center;
            font-size: 1.25rem;
            padding: 3rem 0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1f2937;
            padding: 1.5rem;
            border-radius: 0.5rem;
            max-width: 500px;
            width: 100%;
        }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .modal textarea {
            width: 100%;
            height: 200px;
            background: #374151;
            border: none;
            border-radius: 0.5rem;
            color: white;
            padding: 0.75rem;
            font-family: monospace;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .modal-buttons {
            display: flex;
            gap: 0.5rem;
        }

        @media (min-width: 640px) {
            body {
                padding: 1.5rem;
            }
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Filmy do nagrania</h1>

        <div class="sync-info">
            💾 Dane zapisują się automatycznie w przeglądarce. Użyj eksportu/importu do synchronizacji między urządzeniami.
        </div>

        <div class="sync-buttons">
            <button class="sync-btn" onclick="sendEmail()">📧 Wyślij emailem</button>
            <button class="sync-btn" onclick="copyToClipboard()">📋 Skopiuj dane</button>
            <button class="sync-btn" onclick="exportData()">📤 Pobierz plik</button>
            <button class="sync-btn" onclick="showImportModal()">📥 Importuj dane</button>
            <button class="sync-btn danger small" onclick="resetData()" style="margin-left: auto;">⚠️ Reset</button>
        </div>
        
        <div id="success" class="success-message" style="display: none;"></div>
        <div id="error" class="error-message" style="display: none;"></div>
        
        <div class="stats">
            <div>
                <div class="stat-value blue" id="recorded-count">0</div>
                <div class="stat-label">Nagranych</div>
            </div>
            <div>
                <div class="stat-value yellow" id="empty-count">0</div>
                <div class="stat-label">Pustych pól</div>
            </div>
        </div>
        
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search" placeholder="Szukaj po tytule lub numerze...">
        </div>
        
        <div id="loading" class="loading">Ładowanie...</div>
        <div id="film-list" class="film-list" style="display: none;"></div>
        <div id="no-results" class="no-results" style="display: none;">
            Nie znaleziono filmów pasujących do wyszukiwania
        </div>
    </div>

    <!-- Modal importu -->
    <div id="import-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">Importuj dane</div>
            <textarea id="import-textarea" placeholder="Wklej tutaj wyeksportowane dane..."></textarea>
            <div class="modal-buttons">
                <button class="btn btn-save" onclick="importData()">Importuj</button>
                <button class="btn btn-cancel" onclick="hideImportModal()">Anuluj</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'films-data-v1';

        const initialData = {
            18: { title: "Teatr telewizji", firstCopy: false },
            23: { title: "Cień", firstCopy: false },
            28: { title: "Światła rampy", firstCopy: false },
            33: { title: "Ciotka Hitlera", firstCopy: false },
            38: { title: "Mistrz i Małgorzata", firstCopy: false },
            43: { title: "Who", firstCopy: false },
            48: { title: "Hokusa", firstCopy: false },
            53: { title: "La brea", firstCopy: false },
            58: { title: "Exodus", firstCopy: false },
            63: { title: "Mayfair", firstCopy: false },
            68: { title: "Obcy pasażer", firstCopy: false },
            73: { title: "Mauretańczyk", firstCopy: false },
            78: { title: "Elżbieta", firstCopy: false },
            83: { title: "Elżbiety", firstCopy: false },
            88: { title: "Królowa", firstCopy: false },
            93: { title: "Daniel Blake", firstCopy: false },
            98: { title: "Arras", firstCopy: false },
            103: { title: "Akwizytorom dziekujemy", firstCopy: false },
            108: { title: "Saga", firstCopy: false },
            113: { title: "Królewska gra", firstCopy: false },
            118: { title: "Trzynaście dni", firstCopy: false },
            123: { title: "Odwróceni zakochani", firstCopy: false },
            128: { title: "Medium", firstCopy: false },
            133: { title: "Bastion", firstCopy: false },
            138: { title: "", firstCopy: false },
            143: { title: "Rok z Salingerem", firstCopy: false },
            148: { title: "Pan od muzyki", firstCopy: false },
            153: { title: "", firstCopy: false },
            158: { title: "Ale z naszymi", firstCopy: false },
            163: { title: "Lucy wśród gwiazd", firstCopy: false },
            168: { title: "", firstCopy: false },
            173: { title: "", firstCopy: false },
            178: { title: "Weekend z królem", firstCopy: false },
            183: { title: "Jessebele", firstCopy: false },
            188: { title: "Człowiek przyszłości", firstCopy: false },
            193: { title: "", firstCopy: false },
            198: { title: "Dzieci z jedwabnego", firstCopy: false },
            203: { title: "", firstCopy: false },
            208: { title: "", firstCopy: false },
            213: { title: "", firstCopy: false },
            218: { title: "", firstCopy: false },
            223: { title: "", firstCopy: false }
        };

        let films = {};
        let editingId = null;
        let searchTerm = '';

        const allNumbers = [];
        for (let i = 18; i <= 223; i += 5) {
            allNumbers.push(i);
        }

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // Migracja starych danych (string) do nowego formatu (object)
                    films = {};
                    for (let key in parsed) {
                        if (typeof parsed[key] === 'string') {
                            films[key] = { title: parsed[key], firstCopy: false };
                        } else {
                            films[key] = parsed[key];
                        }
                    }
                } else {
                    films = JSON.parse(JSON.stringify(initialData));
                    saveToStorage();
                }
            } catch (err) {
                console.error('Error loading data:', err);
                films = JSON.parse(JSON.stringify(initialData));
            }
            document.getElementById('loading').style.display = 'none';
            document.getElementById('film-list').style.display = 'flex';
            render();
        }

        function saveToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(films));
            } catch (err) {
                showError('Błąd zapisu: ' + err.message);
            }
        }

        function showSuccess(message) {
            const el = document.getElementById('success');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 3000);
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 3000);
        }

        function updateStats() {
            const recorded = Object.keys(films).filter(k => {
                const film = films[k];
                return film && film.title && film.title.trim();
            }).length;
            const empty = allNumbers.filter(num => {
                const film = films[num];
                return !film || !film.title || film.title.trim() === '';
            }).length;
            document.getElementById('recorded-count').textContent = recorded;
            document.getElementById('empty-count').textContent = empty;
        }

        function getFilteredNumbers() {
            return allNumbers.filter(num => {
                const film = films[num];
                const title = film?.title || '';
                return title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                       num.toString().includes(searchTerm);
            });
        }

        function render() {
            updateStats();
            const filtered = getFilteredNumbers();
            const listEl = document.getElementById('film-list');
            const noResultsEl = document.getElementById('no-results');

            if (filtered.length === 0) {
                listEl.style.display = 'none';
                noResultsEl.style.display = 'block';
                return;
            }

            listEl.style.display = 'flex';
            noResultsEl.style.display = 'none';

            listEl.innerHTML = filtered.map(num => {
                const film = films[num] || { title: '', firstCopy: false };
                const title = film.title || '';
                const firstCopy = film.firstCopy || false;
                const isEmpty = !title || title.trim() === '';
                const isCurrentlyEditing = editingId === num;

                if (isCurrentlyEditing) {
                    return `
                        <div class="film-item ${isEmpty ? 'empty' : ''}">
                            <div class="film-content">
                                <div class="film-row">
                                    <div class="film-number">${num}</div>
                                    <div class="film-title-container">
                                        <div class="film-edit">
                                            <input type="text" id="edit-input-${num}" value="${title}" placeholder="Wpisz tytuł filmu...">
                                            <div class="film-buttons">
                                                <button class="btn btn-save" onclick="saveEdit(${num})">Zapisz</button>
                                                <button class="btn btn-cancel" onclick="cancelEdit()">Anuluj</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="film-item ${isEmpty ? 'empty' : ''}">
                        <div class="film-content">
                            <div class="film-row">
                                <div class="film-number">${num}</div>
                                <div class="film-title-container">
                                    <div class="film-title ${isEmpty ? 'empty' : ''}" onclick="startEdit(${num})">
                                        ${isEmpty ? 'Kliknij aby dodać tytuł...' : title}
                                    </div>
                                </div>
                            </div>
                            ${!isEmpty ? `
                                <div class="film-actions">
                                    <label class="checkbox-container ${firstCopy ? 'checked' : ''}" onclick="event.stopPropagation()">
                                        <input type="checkbox" ${firstCopy ? 'checked' : ''} onchange="toggleFirstCopy(${num})">
                                        <span class="checkbox-label">1× nagrany</span>
                                    </label>
                                    <button class="btn-delete" onclick="deleteFilm(${num})">🗑️ Usuń</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            if (editingId !== null) {
                const input = document.getElementById(`edit-input-${editingId}`);
                if (input) input.focus();
            }
        }

        function startEdit(num) {
            editingId = num;
            render();
        }

        function cancelEdit() {
            editingId = null;
            render();
        }

        function saveEdit(num) {
            const input = document.getElementById(`edit-input-${num}`);
            if (input) {
                const existingFilm = films[num] || { firstCopy: false };
                films[num] = {
                    title: input.value.trim(),
                    firstCopy: existingFilm.firstCopy || false
                };
                saveToStorage();
                showSuccess('Zapisano!');
            }
            editingId = null;
            render();
        }

        function toggleFirstCopy(num) {
            if (films[num]) {
                films[num].firstCopy = !films[num].firstCopy;
                saveToStorage();
                render();
            }
        }

        function deleteFilm(num) {
            if (confirm('Czy na pewno usunąć ten film?')) {
                films[num] = { title: '', firstCopy: false };
                saveToStorage();
                showSuccess('Usunięto!');
                render();
            }
        }

        function exportData() {
            const dataStr = JSON.stringify(films);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'baza-filmow-' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
            URL.revokeObjectURL(url);
            showSuccess('Plik pobrany!');
        }

        function sendEmail() {
            const dataStr = JSON.stringify(films);
            const subject = encodeURIComponent('Filmy do nagrania - synchronizacja');
            const body = encodeURIComponent(dataStr);
            const mailtoLink = `mailto:vihmasajuoorander@gmail.com?subject=${subject}&body=${body}`;
            window.location.href = mailtoLink;
            showSuccess('Otwieranie klienta email...');
        }

        function copyToClipboard() {
            const dataStr = JSON.stringify(films);
            navigator.clipboard.writeText(dataStr).then(() => {
                showSuccess('Dane skopiowane do schowka! (' + dataStr.length + ' znaków)');
            }).catch(err => {
                showError('Błąd kopiowania: ' + err.message);
            });
        }

        function showImportModal() {
            document.getElementById('import-modal').classList.add('active');
        }

        function hideImportModal() {
            document.getElementById('import-modal').classList.remove('active');
            document.getElementById('import-textarea').value = '';
        }

        function importData() {
            const data = document.getElementById('import-textarea').value.trim();
            
            if (!data) {
                showError('Pole importu jest puste. Wklej dane przed importem.');
                return;
            }
            
            try {
                const parsed = JSON.parse(data);
                
                // Sprawdź czy to prawidłowa struktura danych
                if (typeof parsed !== 'object' || parsed === null) {
                    throw new Error('Nieprawidłowa struktura danych');
                }
                
                films = parsed;
                saveToStorage();
                hideImportModal();
                render();
                showSuccess('Dane zaimportowane pomyślnie!');
            } catch (err) {
                console.error('Import error:', err);
                showError('Błąd importu: nieprawidłowy format danych. Upewnij się, że skopiowałeś pełne dane z emaila.');
            }
        }

        function resetData() {
            if (confirm('⚠️ UWAGA! Czy na pewno zresetować bazę do stanu początkowego?\n\nWszystkie Twoje zmiany zostaną bezpowrotnie utracone!\n\nJeśli chcesz zachować dane, najpierw je wyeksportuj.')) {
                films = JSON.parse(JSON.stringify(initialData));
                saveToStorage();
                render();
                showSuccess('Baza zresetowana do stanu początkowego');
            }
        }

        document.getElementById('search').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            render();
        });

        loadData();
    </script>
</body>
</html>
